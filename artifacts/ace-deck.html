  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ange: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin:0; background:#200e15; }\n  a { color:#3FD4C7; }\n  a:hover { color:#7fe6dc; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"173fea33-57df-4e35-819d-d404c8f672f5#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<!-- ═══════════════ COVER ═══════════════ -->\n<section data-label=\"Cover\" data-screen-label=\"00 Cover\" data-speaker-notes=\"A paper walkthrough. The one line to open with: ACE adapts an LLM by engineering its context — the input — instead of touching the weights.\">\n  <div style=\"width:100%;height:100%;box-sizing:border-box;background:linear-gradient(155deg,#341b2c 0%,#271119 58%,#1e0d14 100%);color:#F3ECF0;font-family:'IBM Plex Sans',sans-serif;padding:120px 120px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;\">\n    <div style=\"position:absolute;right:-120px;top:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(63,212,199,.10),transparent 70%);\"><\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:#3FD4C7;margin-bottom:34px;\">Paper Walkthrough<\u002Fdiv>\n    <h1 style=\"font-family:'Space Grotesk',sans-serif;font-size:108px;line-height:1.02;font-weight:600;letter-spacing:-.03em;margin:0 0 30px;max-width:1400px;\">Agentic Context Engineering<\u002Fh1>\n    <p style=\"font-size:40px;line-height:1.3;color:#C9B8C4;margin:0;max-width:1180px;font-weight:300;\">Adapting a model by editing its <span style=\"color:#F3ECF0;font-weight:500;\">context<\u002Fspan>, not its <span style=\"color:#F3ECF0;font-weight:500;\">weights<\u002Fspan> — a growing, self-refining playbook.<\u002Fp>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:22px;color:#8f7d89;margin-top:80px;\">Zhang, Hu et al., 2026<\u002Fdiv>\n    <div style=\"position:absolute;right:120px;bottom:100px;width:400px;transform:rotate(-3deg);background:#E24A4A;color:#2A1220;padding:26px 30px 30px;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.45);\">\n      <div style=\"position:absolute;top:-15px;left:50%;transform:translateX(-50%) rotate(3deg);width:110px;height:28px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.32);\"><\u002Fdiv>\n      <div style=\"font-family:'Caveat',cursive;font-size:34px;line-height:1.15;font-weight:700;\">Read the traces → write feedback → fold it back in.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ SLIDE 1 — TIMELINE ═══════════════ -->\n<section data-label=\"Context Adaptation\" data-screen-label=\"01 Context Adaptation\" data-speaker-notes=\"The timeline is the lineage of natural-language-feedback methods. Dwell on GEPA and Dynamic Cheatsheet — they set up the two failure modes on the next slide. Click each node to walk it.\">\n  <div style=\"width:100%;height:100%;box-sizing:border-box;background:linear-gradient(160deg,#331A2B 0%,#271119 62%,#200e15 100%);color:#F3ECF0;font-family:'IBM Plex Sans',sans-serif;padding:64px 96px 72px;display:flex;flex-direction:column;position:relative;\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#3FD4C7;margin-bottom:14px;\">Part 1 · The lineage<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:60px;font-weight:600;letter-spacing:-.02em;margin:0 0 14px;\">Context Adaptation<\u002Fh2>\n    <p style=\"font-size:28px;line-height:1.4;color:#C9B8C4;margin:0 0 8px;max-width:1500px;font-weight:300;\">Improve behavior by editing the <span style=\"color:#F3ECF0;\">input / context<\u002Fspan>, not the weights. The state of the art is <span style=\"color:#F3ECF0;\">natural-language feedback<\u002Fspan> — the model inspects its traces, reasoning, and validation results, then writes feedback on how to revise the context.<\u002Fp>\n\n    <!-- timeline -->\n    <div style=\"position:relative;margin:44px 40px 8px;\">\n      <div style=\"position:absolute;left:2%;right:2%;top:10px;height:2px;background:linear-gradient(90deg,#3FD4C7,#3FD4C7 78%,#6b5560 78%);\"><\u002Fdiv>\n      <div style=\"position:relative;display:flex;justify-content:space-between;align-items:flex-start;\">\n        <button sc-camel-on-click=\"{{ pickReflexion }}\" style=\"position:relative;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0;font-family:inherit;\">\n          <span style=\"width:22px;height:22px;border-radius:50%;background:#3FD4C7;box-shadow:0 0 0 5px rgba(63,212,199,.15);\"><\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;color:#F3ECF0;\">Reflexion<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#9c8a96;\">2023<\u002Fspan>\n          <sc-if value=\"{{ s1Reflexion }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;top:-8px;width:38px;height:38px;border-radius:50%;border:2px solid #3FD4C7;\"><\u002Fspan><\u002Fsc-if>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ pickTextGrad }}\" style=\"position:relative;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0;font-family:inherit;\">\n          <span style=\"width:22px;height:22px;border-radius:50%;background:#3FD4C7;box-shadow:0 0 0 5px rgba(63,212,199,.15);\"><\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;color:#F3ECF0;\">TextGrad<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#9c8a96;\">2025<\u002Fspan>\n          <sc-if value=\"{{ s1TextGrad }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;top:-8px;width:38px;height:38px;border-radius:50%;border:2px solid #3FD4C7;\"><\u002Fspan><\u002Fsc-if>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ pickGepa }}\" style=\"position:relative;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0;font-family:inherit;\">\n          <span style=\"width:22px;height:22px;border-radius:50%;background:#3FD4C7;box-shadow:0 0 0 5px rgba(63,212,199,.15);\"><\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;color:#F3ECF0;\">GEPA<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#9c8a96;\">2025<\u002Fspan>\n          <sc-if value=\"{{ s1Gepa }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;top:-8px;width:38px;height:38px;border-radius:50%;border:2px solid #3FD4C7;\"><\u002Fspan><\u002Fsc-if>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ pickDc }}\" style=\"position:relative;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0;font-family:inherit;\">\n          <span style=\"width:22px;height:22px;border-radius:50%;background:#3FD4C7;box-shadow:0 0 0 5px rgba(63,212,199,.15);\"><\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;color:#F3ECF0;\">Dynamic Cheatsheet<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#9c8a96;\">2025<\u002Fspan>\n          <sc-if value=\"{{ s1Dc }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;top:-8px;width:38px;height:38px;border-radius:50%;border:2px solid #3FD4C7;\"><\u002Fspan><\u002Fsc-if>\n        <\u002Fbutton>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;\">\n          <span style=\"width:22px;height:22px;border-radius:50%;background:#6b5560;\"><\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;color:#8f7d89;\">ACE<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#6b5560;\">next →<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- panel -->\n    <div style=\"flex:1;margin-top:34px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:34px 40px;position:relative;min-height:0;\">\n      <sc-if value=\"{{ s1None }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"height:100%;display:flex;align-items:center;justify-content:center;color:#9c8a96;font-size:26px;font-family:'JetBrains Mono',monospace;\">▲ Click a method to trace the lineage<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ s1Reflexion }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ closeS1 }}\" style=\"position:absolute;top:22px;right:26px;background:none;border:1px solid rgba(255,255,255,.2);color:#C9B8C4;border-radius:20px;padding:6px 16px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:14px;\">close ✕<\u002Fbutton>\n        <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin:0 0 4px;\">Reflexion <span style=\"font-size:20px;color:#9c8a96;font-weight:400;\">· Shinn et al., 2023<\u002Fspan><\u002Fh3>\n        <p style=\"font-size:27px;line-height:1.5;color:#DCD0D8;max-width:1300px;margin:16px 0 0;\">The agent acts, writes a natural-language reflection on what went wrong, and retries. Verbal self-feedback is stored in an episodic buffer — the first <span style=\"color:#3FD4C7;\">read-the-trace, write-feedback<\u002Fspan> loop.<\u002Fp>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ s1TextGrad }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ closeS1 }}\" style=\"position:absolute;top:22px;right:26px;background:none;border:1px solid rgba(255,255,255,.2);color:#C9B8C4;border-radius:20px;padding:6px 16px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:14px;\">close ✕<\u002Fbutton>\n        <div style=\"display:flex;gap:40px;align-items:center;\">\n          <div style=\"flex:1;\">\n            <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin:0 0 4px;\">TextGrad <span style=\"font-size:20px;color:#9c8a96;font-weight:400;\">· Yuksekgonul et al., 2025<\u002Fspan><\u002Fh3>\n            <p style=\"font-size:26px;line-height:1.5;color:#DCD0D8;margin:16px 0 0;\">Backpropagates <span style=\"color:#3FD4C7;\">textual gradients<\u002Fspan>: the loss is a natural-language critique that rewrites the entire prompt each step. One monolithic variable — no itemized structure to preserve.<\u002Fp>\n          <\u002Fdiv>\n          <img src=\"0d65a4ba-4369-4d6c-b1e7-ab9c968608cb\" alt=\"TextGrad diagram\" style=\"width:520px;flex-shrink:0;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);\">\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ s1Gepa }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ closeS1 }}\" style=\"position:absolute;top:22px;right:26px;background:none;border:1px solid rgba(255,255,255,.2);color:#C9B8C4;border-radius:20px;padding:6px 16px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:14px;\">close ✕<\u002Fbutton>\n        <div style=\"display:flex;gap:40px;align-items:center;\">\n          <div style=\"flex:1;\">\n            <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin:0 0 4px;\">GEPA <span style=\"font-size:20px;color:#9c8a96;font-weight:400;\">· Agrawal et al., 2025 · Genetic-Pareto<\u002Fspan><\u002Fh3>\n            <p style=\"font-size:26px;line-height:1.5;color:#DCD0D8;margin:16px 0 0;\">Evolves concise prompt variants and keeps a <span style=\"color:#3FD4C7;\">Pareto frontier<\u002Fspan> of the best: reflect on traces → propose whole-prompt variants → validate on a held-out set. Rewarding brevity is exactly where <span style=\"color:#F4B740;\">brevity bias<\u002Fspan> creeps in.<\u002Fp>\n          <\u002Fdiv>\n          <img src=\"912077c7-ff18-49ab-8d0c-c25bb45b7700\" alt=\"GEPA diagram\" style=\"width:540px;flex-shrink:0;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);\">\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ s1Dc }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ closeS1 }}\" style=\"position:absolute;top:22px;right:26px;background:none;border:1px solid rgba(255,255,255,.2);color:#C9B8C4;border-radius:20px;padding:6px 16px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:14px;\">close ✕<\u002Fbutton>\n        <div style=\"display:flex;gap:40px;align-items:center;\">\n          <div style=\"flex:1;\">\n            <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin:0 0 4px;\">Dynamic Cheatsheet <span style=\"font-size:20px;color:#9c8a96;font-weight:400;\">· Suzgun et al., 2025<\u002Fspan><\u002Fh3>\n            <p style=\"font-size:26px;line-height:1.5;color:#DCD0D8;margin:16px 0 0;\">External memory: a single model both <span style=\"color:#3FD4C7;\">solves and curates<\u002Fspan> a free-form cheatsheet, rewriting the whole sheet every step. Persistent — but the full rewrite is where <span style=\"color:#FF6B6B;\">context collapse<\u002Fspan> begins.<\u002Fp>\n          <\u002Fdiv>\n          <img src=\"294f42e3-0ef9-4b37-b051-427183badff5\" alt=\"Dynamic Cheatsheet diagram\" style=\"width:540px;flex-shrink:0;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);\">\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;right:70px;bottom:60px;width:360px;transform:rotate(2.5deg);background:#E24A4A;color:#2A1220;padding:22px 26px 26px;border-radius:2px;box-shadow:0 16px 34px rgba(0,0,0,.4);z-index:5;\">\n      <div style=\"position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-4deg);width:96px;height:26px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.32);\"><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:4px;\">Remember<\u002Fdiv>\n      <div style=\"font-family:'Caveat',cursive;font-size:31px;line-height:1.15;font-weight:700;\">Same idea underneath — read the traces, write feedback, fold it back in.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ SLIDE 2 — TWO-SIDED TOGGLE ═══════════════ -->\n<section data-label=\"Limitations\" data-screen-label=\"02 Limitations\" data-speaker-notes=\"Two failure modes. Brevity bias (from GEPA-style optimization) and context collapse (from Dynamic Cheatsheet's monolithic rewrite). Click a side to expand it. Tie collapse back to the DC diagram from slide 1.\">\n  <div style=\"width:100%;height:100%;box-sizing:border-box;background:linear-gradient(160deg,#331A2B 0%,#271119 62%,#200e15 100%);color:#F3ECF0;font-family:'IBM Plex Sans',sans-serif;padding:64px 96px 72px;display:flex;flex-direction:column;position:relative;\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#F4B740;margin-bottom:14px;\">Part 2 · Where it breaks<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;letter-spacing:-.02em;margin:0 0 30px;\">Limitations of Existing Context Adaptation<\u002Fh2>\n\n    <div style=\"flex:1;min-height:0;display:flex;gap:32px;\">\n      <sc-if value=\"{{ s2None }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;display:flex;gap:32px;\">\n          <button sc-camel-on-click=\"{{ pickBrevity }}\" style=\"flex:1;text-align:left;cursor:pointer;background:rgba(244,183,64,.07);border:1px solid rgba(244,183,64,.3);border-radius:20px;padding:48px 44px;font-family:inherit;color:#F3ECF0;display:flex;flex-direction:column;justify-content:center;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.2em;color:#F4B740;text-transform:uppercase;margin-bottom:20px;\">Failure mode 1<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:48px;font-weight:600;margin-bottom:20px;\">Brevity Bias<\u002Fdiv>\n            <div style=\"font-size:27px;line-height:1.4;color:#C9B8C4;\">Optimization drifts toward short, generic prompts.<\u002Fdiv>\n            <div style=\"margin-top:36px;font-family:'JetBrains Mono',monospace;font-size:17px;color:#F4B740;\">click to expand →<\u002Fdiv>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ pickCollapse }}\" style=\"flex:1;text-align:left;cursor:pointer;background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.3);border-radius:20px;padding:48px 44px;font-family:inherit;color:#F3ECF0;display:flex;flex-direction:column;justify-content:center;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.2em;color:#FF6B6B;text-transform:uppercase;margin-bottom:20px;\">Failure mode 2<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:48px;font-weight:600;margin-bottom:20px;\">Context Collapse<\u002Fdiv>\n            <div style=\"font-size:27px;line-height:1.4;color:#C9B8C4;\">A monolithic rewrite compresses everything into a lossy summary.<\u002Fdiv>\n            <div style=\"margin-top:36px;font-family:'JetBrains Mono',monospace;font-size:17px;color:#FF6B6B;\">click to expand →<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ s2Brevity }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;gap:32px;\">\n          <button sc-camel-on-click=\"{{ closeS2 }}\" style=\"width:300px;flex-shrink:0;text-align:left;cursor:pointer;background:rgba(244,183,64,.12);border:1px solid rgba(244,183,64,.45);border-radius:20px;padding:44px 36px;font-family:inherit;color:#F3ECF0;display:flex;flex-direction:column;justify-content:center;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.2em;color:#F4B740;text-transform:uppercase;margin-bottom:16px;\">Failure mode 1<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;\">Brevity Bias<\u002Fdiv>\n            <div style=\"margin-top:28px;font-family:'JetBrains Mono',monospace;font-size:15px;color:#9c8a96;\">✕ back to both<\u002Fdiv>\n          <\u002Fbutton>\n          <div style=\"flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(244,183,64,.3);border-radius:20px;padding:44px 48px;display:flex;flex-direction:column;justify-content:center;\">\n            <p style=\"font-size:30px;line-height:1.4;margin:0 0 30px;color:#F3ECF0;\">Optimization collapses toward <span style=\"color:#F4B740;\">short, generic prompts<\u002Fspan>.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:22px;\">\n              <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"color:#F4B740;font-size:26px;line-height:1.3;\">◆<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#DCD0D8;\"><b style=\"color:#F3ECF0;font-weight:600;\">Diversity sacrificed<\u002Fb> — iterations converge on near-identical instructions.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"color:#F4B740;font-size:26px;line-height:1.3;\">◆<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#DCD0D8;\"><b style=\"color:#F3ECF0;font-weight:600;\">Domain detail removed<\u002Fb> — tool quirks, edge cases, and failure modes get stripped out.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"color:#F4B740;font-size:26px;line-height:1.3;\">◆<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#DCD0D8;\"><b style=\"color:#F3ECF0;font-weight:600;\">Worst where rich guidance matters<\u002Fb> — multi-step agents, program synthesis, knowledge-intensive reasoning.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ s2Collapse }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;gap:32px;\">\n          <div style=\"flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,107,107,.3);border-radius:20px;padding:34px 40px;display:flex;flex-direction:column;\">\n            <p style=\"font-size:27px;line-height:1.4;margin:0 0 18px;color:#F3ECF0;\">A full-LLM rewrite compresses growing context into a short, lossy summary — knowledge <span style=\"color:#FF6B6B;\">erased abruptly<\u002Fspan>.<\u002Fp>\n            <img src=\"04564b86-d4e5-467d-82ff-06256efa3ec9\" alt=\"Context collapse curve\" style=\"width:100%;flex:1;min-height:0;object-fit:contain;border-radius:12px;\">\n            <div style=\"margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:19px;color:#C9B8C4;text-align:center;\">step 60 · <span style=\"color:#3FD4C7;\">18,282 tok · 66.7%<\u002Fspan> &nbsp;→&nbsp; step 61 · <span style=\"color:#FF6B6B;\">122 tok · 57.1%<\u002Fspan> <span style=\"color:#8f7d89;\">(below the 63.7% no-context baseline)<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeS2 }}\" style=\"width:300px;flex-shrink:0;text-align:left;cursor:pointer;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.45);border-radius:20px;padding:44px 36px;font-family:inherit;color:#F3ECF0;display:flex;flex-direction:column;justify-content:center;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.2em;color:#FF6B6B;text-transform:uppercase;margin-bottom:16px;\">Failure mode 2<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;\">Context Collapse<\u002Fdiv>\n            <div style=\"margin-top:28px;font-family:'JetBrains Mono',monospace;font-size:15px;color:#9c8a96;\">✕ back to both<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;left:50%;bottom:40px;transform:translateX(-50%) rotate(-2deg);width:640px;background:#E24A4A;color:#2A1220;padding:20px 30px 24px;border-radius:2px;box-shadow:0 16px 34px rgba(0,0,0,.4);z-index:5;\">\n      <div style=\"position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(3deg);width:96px;height:26px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.32);\"><\u002Fdiv>\n      <div style=\"font-family:'Caveat',cursive;font-size:30px;line-height:1.15;font-weight:700;\">The problem isn't external memory — it's the <u>monolithic rewrite<\u002Fu>. Persistence and update-mechanism are different axes.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ SLIDE 3 — ACE FRAMEWORK ═══════════════ -->\n<section data-label=\"ACE Framework\" data-screen-label=\"03 ACE Framework\" data-speaker-notes=\"Walk the roles in order: Query, Generator, Trajectory, Reflector, Insights, Curator, Delta, Playbook. The same LLM plays all three roles — the win is architecture, not a smarter model. Click each chip to explain it.\">\n  <div style=\"width:100%;height:100%;box-sizing:border-box;background:linear-gradient(160deg,#331A2B 0%,#271119 62%,#200e15 100%);color:#F3ECF0;font-family:'IBM Plex Sans',sans-serif;padding:56px 96px 64px;display:flex;flex-direction:column;position:relative;\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#3FD4C7;margin-bottom:12px;\">Part 3 · The framework<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;letter-spacing:-.02em;margin:0 0 22px;\">Agentic Context Engineering<\u002Fh2>\n\n    <div style=\"display:flex;justify-content:center;\">\n      <img src=\"aa69847e-0d6f-451c-826a-405552d3e6c1\" alt=\"ACE framework diagram\" style=\"width:1180px;max-width:100%;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.4);\">\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;justify-content:center;\">\n      <button sc-camel-on-click=\"{{ pickQuery }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:18px;padding:11px 22px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:#F3ECF0;\">Query<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pickGenerator }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:18px;padding:11px 22px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:#F3ECF0;\">Generator<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pickTrajectory }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:18px;padding:11px 22px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:#F3ECF0;\">Trajectory<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pickReflector }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:18px;padding:11px 22px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:#F3ECF0;\">Reflector<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pickInsights }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:18px;padding:11px 22px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:#F3ECF0;\">Insights<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pickCurator }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:18px;padding:11px 22px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:#F3ECF0;\">Curator<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pickDelta }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:18px;padding:11px 22px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:#F3ECF0;\">Delta Items<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pickPlaybook }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:18px;padding:11px 22px;border-radius:22px;background:rgba(63,212,199,.1);border:1px solid rgba(63,212,199,.4);color:#3FD4C7;\">Context Playbook<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-height:0;margin-top:22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:26px 40px;display:flex;align-items:center;position:relative;\">\n      <button sc-camel-on-click=\"{{ closeS3 }}\" style=\"position:absolute;top:18px;right:24px;background:none;border:1px solid rgba(255,255,255,.18);color:#C9B8C4;border-radius:20px;padding:5px 15px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:13px;\">reset ✕<\u002Fbutton>\n      <sc-if value=\"{{ s3None }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:100%;text-align:center;color:#9c8a96;font-size:24px;font-family:'JetBrains Mono',monospace;\">Click a component above to see its role in the loop<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ s3Query }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:29px;line-height:1.4;\"><b style=\"font-family:'Space Grotesk',sans-serif;color:#3FD4C7;\">Query<\u002Fb> — the incoming task the agent has to solve.<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ s3Generator }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:29px;line-height:1.4;\"><b style=\"font-family:'Space Grotesk',sans-serif;color:#3FD4C7;\">Generator<\u002Fb> — runs the task, produces reasoning and tool-call trajectories, and flags which playbook bullets helped or misled.<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ s3Trajectory }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:29px;line-height:1.4;\"><b style=\"font-family:'Space Grotesk',sans-serif;color:#3FD4C7;\">Trajectory<\u002Fb> — the produced reasoning trace, handed to the Reflector as evidence.<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ s3Reflector }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:29px;line-height:1.4;\"><b style=\"font-family:'Space Grotesk',sans-serif;color:#3FD4C7;\">Reflector<\u002Fb> — distills concrete lessons from success and failure, refining them across iterations (the loop).<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ s3Insights }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:29px;line-height:1.4;\"><b style=\"font-family:'Space Grotesk',sans-serif;color:#3FD4C7;\">Insights<\u002Fb> — the distilled lessons passed on to the Curator.<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ s3Curator }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:29px;line-height:1.4;\"><b style=\"font-family:'Space Grotesk',sans-serif;color:#3FD4C7;\">Curator<\u002Fb> — writes compact <span style=\"color:#3FD4C7;\">delta<\u002Fspan> bullets, merged into the playbook by deterministic, non-LLM logic.<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ s3Delta }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:29px;line-height:1.4;\"><b style=\"font-family:'Space Grotesk',sans-serif;color:#3FD4C7;\">Delta Context Items<\u002Fb> — the localized candidate bullets being merged in — never a full rewrite.<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ s3Playbook }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:29px;line-height:1.4;\"><b style=\"font-family:'Space Grotesk',sans-serif;color:#3FD4C7;\">Context Playbook<\u002Fb> — itemized bullets plus metadata (helpful / harmful counters): the persistent, external, <span style=\"color:#3FD4C7;\">structured<\u002Fspan> memory.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;right:60px;top:150px;width:330px;transform:rotate(3deg);background:#E24A4A;color:#2A1220;padding:20px 24px 24px;border-radius:2px;box-shadow:0 16px 34px rgba(0,0,0,.4);z-index:5;\">\n      <div style=\"position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);width:90px;height:26px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.32);\"><\u002Fdiv>\n      <div style=\"font-family:'Caveat',cursive;font-size:31px;line-height:1.15;font-weight:700;\">Same LLM in all three roles. The win is <u>architecture<\u002Fu>, not a smarter model.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ SLIDE 4 — PLAYBOOK GROWS ═══════════════ -->\n<section data-label=\"Playbook Grows\" data-screen-label=\"04 Playbook Grows\" data-speaker-notes=\"The heart of the talk. Step through it with Next. A delta bullet is APPENDED, not overwritten. Contrast with DC, which would rewrite the whole board. Then grow (assign ID + counters) and refine (increment counters, merge semantic duplicates). Same board, one sharper bullet richer.\">\n  <div style=\"width:100%;height:100%;box-sizing:border-box;background:linear-gradient(160deg,#331A2B 0%,#271119 62%,#200e15 100%);color:#F3ECF0;font-family:'IBM Plex Sans',sans-serif;padding:56px 96px 60px;display:flex;flex-direction:column;position:relative;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#3FD4C7;margin-bottom:12px;\">Part 3b · The mechanism<\u002Fdiv>\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:600;letter-spacing:-.02em;margin:0;\">The Playbook Grows: Delta Updates &amp; Grow-and-Refine<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;flex-shrink:0;\">\n        <button sc-camel-on-click=\"{{ prevS4 }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:17px;padding:12px 22px;border-radius:24px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);color:#F3ECF0;\">← Prev<\u002Fbutton>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#C9B8C4;min-width:70px;text-align:center;\">Step {{ s4 }}/5<\u002Fspan>\n        <button sc-camel-on-click=\"{{ nextS4 }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:17px;padding:12px 22px;border-radius:24px;background:#3FD4C7;border:1px solid #3FD4C7;color:#10201d;font-weight:600;\">Next →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-height:0;margin-top:28px;display:flex;gap:36px;\">\n      <!-- BOARD -->\n      <div style=\"flex:1;position:relative;background:rgba(244,227,176,.05);border:1px dashed rgba(244,227,176,.3);border-radius:18px;padding:30px 34px;overflow:hidden;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#F4E3B0;opacity:.8;margin-bottom:20px;\">Context Playbook · appworld<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <!-- base bullets -->\n          <div style=\"background:#F4E3B0;color:#2A1220;padding:16px 20px;border-radius:4px;transform:rotate(-.6deg);box-shadow:0 6px 16px rgba(0,0,0,.28);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#8a6d1e;margin-bottom:5px;\">[apw-00012] helpful=5 harmful=0<\u002Fdiv>\n            <div style=\"font-size:22px;line-height:1.3;\">Enumerate available apps via the supervisor API before acting.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#F4E3B0;color:#2A1220;padding:16px 20px;border-radius:4px;transform:rotate(.5deg);box-shadow:0 6px 16px rgba(0,0,0,.28);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#8a6d1e;margin-bottom:5px;\">[apw-00027] helpful=3 harmful=1<\u002Fdiv>\n            <div style=\"font-size:22px;line-height:1.3;\">Prefer show_task_ids() over guessing task identifiers.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#F4E3B0;color:#2A1220;padding:16px 20px;border-radius:4px;transform:rotate(-.4deg);box-shadow:0 6px 16px rgba(0,0,0,.28);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#8a6d1e;margin-bottom:5px;\">[apw-00031] helpful=2 harmful=0<\u002Fdiv>\n            <div style=\"font-size:22px;line-height:1.3;\">Commit only after every sub-task passes validation.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- existing near-duplicate (pre-merge) -->\n          <sc-if value=\"{{ s4preMerge }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#F4E3B0;color:#2A1220;padding:16px 20px;border-radius:4px;transform:rotate(.6deg);box-shadow:0 6px 16px rgba(0,0,0,.28);opacity:.9;\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#8a6d1e;margin-bottom:5px;\">[apw-00044] helpful=1 harmful=0<\u002Fdiv>\n              <div style=\"font-size:22px;line-height:1.3;\">Resolve payees from the Phone contacts app.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- NEW delta bullet -->\n          <sc-if value=\"{{ s4deltaVisible }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#F4E3B0;color:#2A1220;padding:16px 20px;border-radius:4px;transform:rotate(-.7deg);box-shadow:0 10px 22px rgba(0,0,0,.34);border-left:5px solid #3FD4C7;\">\n              <sc-if value=\"{{ s4newTag }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#2f8f86;margin-bottom:5px;\">+ new delta · uncommitted<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ s4growTag }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#2f8f86;margin-bottom:5px;\">[apw-00051] helpful=0 harmful=0<\u002Fdiv><\u002Fsc-if>\n              <div style=\"font-size:22px;line-height:1.3;\">Resolve identities from Phone contacts, not transaction descriptions.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- MERGED bullet -->\n          <sc-if value=\"{{ s4merged }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#F4E3B0;color:#2A1220;padding:16px 20px;border-radius:4px;transform:rotate(-.5deg);box-shadow:0 10px 22px rgba(0,0,0,.34);border-left:5px solid #3FD4C7;\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#2f8f86;\">[apw-00044] helpful=2 harmful=0<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;background:#3FD4C7;color:#10201d;padding:2px 8px;border-radius:10px;\">merged ×2<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:22px;line-height:1.3;\">Resolve identities from Phone contacts (not transaction descriptions).<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- contrast overlay -->\n        <sc-if value=\"{{ s4contrast }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;inset:0;background:rgba(30,10,16,.93);backdrop-filter:blur(2px);border:2px solid rgba(255,107,107,.6);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:700;color:#FF6B6B;letter-spacing:.04em;\">REWRITE → COLLAPSE<\u002Fdiv>\n            <div style=\"font-size:26px;line-height:1.4;color:#F3ECF0;max-width:640px;margin-top:20px;\">A Dynamic-Cheatsheet-style full rewrite would regenerate the entire sheet — and could erase all of this. <span style=\"color:#3FD4C7;font-weight:600;\">ACE never does that.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- NARRATION -->\n      <div style=\"width:520px;flex-shrink:0;display:flex;flex-direction:column;\">\n        <div style=\"display:flex;gap:8px;margin-bottom:26px;\">\n          <sc-if value=\"{{ dot0 }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:#3FD4C7;\"><\u002Fspan><\u002Fsc-if><sc-if value=\"{{ ndot0 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);\"><\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ dot1 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:#3FD4C7;\"><\u002Fspan><\u002Fsc-if><sc-if value=\"{{ ndot1 }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);\"><\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ dot2 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:#3FD4C7;\"><\u002Fspan><\u002Fsc-if><sc-if value=\"{{ ndot2 }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);\"><\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ dot3 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:#3FD4C7;\"><\u002Fspan><\u002Fsc-if><sc-if value=\"{{ ndot3 }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);\"><\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ dot4 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:#3FD4C7;\"><\u002Fspan><\u002Fsc-if><sc-if value=\"{{ ndot4 }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);\"><\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ dot5 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:#3FD4C7;\"><\u002Fspan><\u002Fsc-if><sc-if value=\"{{ ndot5 }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:36px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);\"><\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:36px 34px;display:flex;flex-direction:column;justify-content:center;\">\n          <sc-if value=\"{{ dot0 }}\" hint-placeholder-val=\"{{ true }}\"><div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#F4E3B0;margin-bottom:16px;\">Starting state<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#DCD0D8;\">Three curated, itemized bullets — each carrying its own utility counters.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ dot1 }}\" hint-placeholder-val=\"{{ false }}\"><div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#3FD4C7;margin-bottom:16px;\">1 · Append a delta<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#DCD0D8;\">A new task runs. The Reflector distills a lesson; the Curator writes it as a delta bullet — <b style=\"color:#F3ECF0;\">appended, nothing overwritten.<\u002Fb><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ dot2 }}\" hint-placeholder-val=\"{{ false }}\"><div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#FF6B6B;margin-bottom:16px;\">The contrast<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#DCD0D8;\">A monolithic rewrite would regenerate the whole board and risk erasing it. ACE only ever edits <b style=\"color:#F3ECF0;\">locally<\u002Fb>.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ dot3 }}\" hint-placeholder-val=\"{{ false }}\"><div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#3FD4C7;margin-bottom:16px;\">2 · Grow<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#DCD0D8;\">The delta is committed: assigned an ID and utility counters <span style=\"font-family:'JetBrains Mono',monospace;font-size:21px;\">helpful=0 harmful=0<\u002Fspan>.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ dot4 }}\" hint-placeholder-val=\"{{ false }}\"><div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#3FD4C7;margin-bottom:16px;\">3 · Refine<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#DCD0D8;\">Used successfully → <span style=\"font-family:'JetBrains Mono',monospace;font-size:21px;\">helpful<\u002Fspan> increments. A semantic duplicate (apw-00044) is <b style=\"color:#F3ECF0;\">merged deterministically<\u002Fb> — no LLM rewrite.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ dot5 }}\" hint-placeholder-val=\"{{ false }}\"><div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#F4E3B0;margin-bottom:16px;\">End state<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#DCD0D8;\">Same board — one sharper, de-duplicated bullet richer. Nothing erased.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;left:96px;bottom:34px;width:560px;transform:rotate(-1.6deg);background:#E24A4A;color:#2A1220;padding:16px 26px 20px;border-radius:2px;box-shadow:0 16px 34px rgba(0,0,0,.4);z-index:5;\">\n      <div style=\"position:absolute;top:-13px;left:40px;transform:rotate(6deg);width:84px;height:24px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.32);\"><\u002Fdiv>\n      <div style=\"font-family:'Caveat',cursive;font-size:28px;line-height:1.15;font-weight:700;\">Append, don't overwrite. Increment counters, dedupe by meaning. The board only grows <u>sharper<\u002Fu>.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ SLIDE 5 — RESULTS I ═══════════════ -->\n<section data-label=\"Results I · Agents\" data-screen-label=\"05 Results I Agents\" data-speaker-notes=\"AppWorld agent results. +10.6% average over baselines; up to +17.1% from execution feedback without labels. ReAct+ACE on open-source DeepSeek matches IBM-CUGA on GPT-4.1 overall, and surpasses it on the test-challenge split.\">\n  <div style=\"width:100%;height:100%;box-sizing:border-box;background:linear-gradient(160deg,#331A2B 0%,#271119 62%,#200e15 100%);color:#F3ECF0;font-family:'IBM Plex Sans',sans-serif;padding:56px 96px 64px;display:flex;flex-direction:column;position:relative;\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#3FD4C7;margin-bottom:12px;\">Part 4 · Results — agents<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;letter-spacing:-.02em;margin:0 0 30px;\">AppWorld: Matching a Production Agent<\u002Fh2>\n\n    <div style=\"flex:1;min-height:0;display:flex;gap:40px;align-items:flex-start;\">\n      <img src=\"9659fc35-e08a-43c2-9ed8-46944e7edfbe\" alt=\"AppWorld results table\" style=\"flex:1.15;min-width:0;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.4);\">\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:22px;\">\n        <img src=\"be2ae746-506e-4a2f-b3b3-f4722345cd2d\" alt=\"AppWorld leaderboard snapshot\" style=\"width:100%;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.4);\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;padding:6px 4px;\">\n          <div style=\"display:flex;gap:16px;align-items:baseline;\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;color:#3FD4C7;min-width:130px;\">+10.6%<\u002Fspan><span style=\"font-size:23px;line-height:1.35;color:#DCD0D8;\">average gain over baselines.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;align-items:baseline;\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;color:#3FD4C7;min-width:130px;\">+17.1%<\u002Fspan><span style=\"font-size:23px;line-height:1.35;color:#DCD0D8;\">from execution feedback — <b style=\"color:#F3ECF0;\">without ground-truth labels.<\u002Fb><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;align-items:baseline;\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;color:#F4B740;min-width:130px;\">59.4%<\u002Fspan><span style=\"font-size:23px;line-height:1.35;color:#DCD0D8;\">ReAct+ACE avg ≈ IBM-CUGA 60.3% — and ACE <b style=\"color:#F3ECF0;\">surpasses<\u002Fb> CUGA on test-challenge.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;right:70px;bottom:44px;width:400px;transform:rotate(2deg);background:#E24A4A;color:#2A1220;padding:20px 26px 24px;border-radius:2px;box-shadow:0 16px 34px rgba(0,0,0,.4);z-index:5;\">\n      <div style=\"position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);width:96px;height:26px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.32);\"><\u002Fdiv>\n      <div style=\"font-family:'Caveat',cursive;font-size:30px;line-height:1.15;font-weight:700;\">Open-source DeepSeek matched a GPT-4.1 production agent — by engineering context, not weights.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ SLIDE 6 — RESULTS II ═══════════════ -->\n<section data-label=\"Results II · Cost\" data-screen-label=\"06 Results II Cost\" data-speaker-notes=\"Finance results (+8.6% avg) with the honest caveat: without reliable feedback, ACE and DC can both degrade. Then the cost story: 86.9% lower adaptation latency on average. The sophisticated beat is KV-cache reuse — longer context is not linearly more expensive.\">\n  <div style=\"width:100%;height:100%;box-sizing:border-box;background:linear-gradient(160deg,#331A2B 0%,#271119 62%,#200e15 100%);color:#F3ECF0;font-family:'IBM Plex Sans',sans-serif;padding:56px 96px 60px;display:flex;flex-direction:column;position:relative;\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#3FD4C7;margin-bottom:12px;\">Part 4 · Results — domain &amp; cost<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;letter-spacing:-.02em;margin:0 0 28px;\">Domain Accuracy — and It's Cheaper<\u002Fh2>\n\n    <div style=\"flex:1;min-height:0;display:flex;gap:40px;align-items:flex-start;\">\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:18px;\">\n        <img src=\"2ad81337-b260-4061-8b5c-03a9c28fbe07\" alt=\"Financial analysis results\" style=\"width:100%;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.4);\">\n        <div style=\"font-size:21px;line-height:1.4;color:#C9B8C4;padding:0 4px;\"><span style=\"color:#F4B740;font-weight:600;\">Honest caveat:<\u002Fspan> without reliable feedback, ACE <i>and<\u002Fi> DC can degrade — quality depends on the feedback signal. Transfers to medical (DDXPlus) &amp; text-to-SQL (BIRD-SQL).<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:20px;\">\n        <img src=\"39692ac1-3713-4906-b75c-9613fd3c784f\" alt=\"Cost and speed analysis\" style=\"width:100%;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.4);\">\n        <div style=\"background:rgba(63,212,199,.08);border:1px solid rgba(63,212,199,.32);border-radius:14px;padding:22px 26px;\">\n          <div style=\"display:flex;gap:18px;align-items:baseline;margin-bottom:10px;\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;color:#3FD4C7;\">91.8%<\u002Fspan><span style=\"font-size:22px;line-height:1.3;color:#DCD0D8;\">of input tokens served from <b style=\"color:#F3ECF0;\">KV-cache<\u002Fb>.<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:22px;line-height:1.4;color:#C9B8C4;\">A longer playbook isn't linearly more expensive — cache reuse cuts billed input cost by <span style=\"color:#3FD4C7;font-weight:600;\">82.6%<\u002Fspan>.\n<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;left:50%;bottom:26px;transform:translateX(-50%) rotate(-1.5deg);width:600px;background:#E24A4A;color:#2A1220;padding:16px 28px 20px;border-radius:2px;box-shadow:0 16px 34px rgba(0,0,0,.4);z-index:5;\">\n      <div style=\"position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(4deg);width:88px;height:24px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.32);\"><\u002Fdiv>\n      <div style=\"font-family:'Caveat',cursive;font-size:29px;line-height:1.15;font-weight:700;\">Longer context isn't linearly more expensive — 91.8% of it was served from cache.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════ SLIDE 7 — CLOSE ═══════════════ -->\n<section data-label=\"What ACE Is &amp; Isn't\" data-screen-label=\"07 What ACE Is and Isnt\" data-speaker-notes=\"The honest close. ACE beats GEPA on cost and detail retention; beats DC by avoiding collapse. Its novelty is naming and fixing brevity bias and context collapse — not being first to multi-turn memory. Tasks with one fixed rule (Game-of-24) gain little.\">\n  <div style=\"width:100%;height:100%;box-sizing:border-box;background:linear-gradient(160deg,#331A2B 0%,#271119 62%,#200e15 100%);color:#F3ECF0;font-family:'IBM Plex Sans',sans-serif;padding:56px 96px 64px;display:flex;flex-direction:column;position:relative;\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#3FD4C7;margin-bottom:12px;\">Part 5 · The honest close<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;letter-spacing:-.02em;margin:0 0 34px;\">What ACE Is — and Isn't<\u002Fh2>\n\n    <div style=\"flex:1;min-height:0;display:flex;gap:32px;\">\n      <div style=\"flex:1;background:rgba(63,212,199,.06);border:1px solid rgba(63,212,199,.28);border-radius:18px;padding:38px 40px;\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;color:#3FD4C7;margin-bottom:26px;\">vs. GEPA<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:20px;\">\n          <div style=\"display:flex;gap:16px;\"><span style=\"color:#3FD4C7;font-size:24px;\">→<\u002Fspan><span style=\"font-size:25px;line-height:1.4;color:#DCD0D8;\">Keeps domain detail instead of shedding it for brevity.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;\"><span style=\"color:#3FD4C7;font-size:24px;\">→<\u002Fspan><span style=\"font-size:25px;line-height:1.4;color:#DCD0D8;\"><b style=\"color:#F3ECF0;\">−82.3% latency, −75.1% rollouts<\u002Fb> to adapt (offline AppWorld).<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:rgba(63,212,199,.06);border:1px solid rgba(63,212,199,.28);border-radius:18px;padding:38px 40px;\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;color:#3FD4C7;margin-bottom:26px;\">vs. Dynamic Cheatsheet<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:20px;\">\n          <div style=\"display:flex;gap:16px;\"><span style=\"color:#3FD4C7;font-size:24px;\">→<\u002Fspan><span style=\"font-size:25px;line-height:1.4;color:#DCD0D8;\">Itemized delta updates avoid the monolithic-rewrite collapse.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;\"><span style=\"color:#3FD4C7;font-size:24px;\">→<\u002Fspan><span style=\"font-size:25px;line-height:1.4;color:#DCD0D8;\"><b style=\"color:#F3ECF0;\">−91.5% latency, −83.6% token cost<\u002Fb> (online FiNER).<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:rgba(244,183,64,.06);border:1px solid rgba(244,183,64,.3);border-radius:18px;padding:38px 40px;\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;color:#F4B740;margin-bottom:26px;\">Where it isn't the answer<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:20px;\">\n          <div style=\"display:flex;gap:16px;\"><span style=\"color:#F4B740;font-size:24px;\">•<\u002Fspan><span style=\"font-size:25px;line-height:1.4;color:#DCD0D8;\">Not first to multi-turn memory.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;\"><span style=\"color:#F4B740;font-size:24px;\">•<\u002Fspan><span style=\"font-size:25px;line-height:1.4;color:#DCD0D8;\">Tasks with one fixed rule (Game-of-24) gain little.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;\"><span style=\"color:#F4B740;font-size:24px;\">•<\u002Fspan><span style=\"font-size:25px;line-height:1.4;color:#DCD0D8;\">Needs a real feedback signal to improve.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;right:70px;bottom:46px;width:430px;transform:rotate(2.5deg);background:#E24A4A;color:#2A1220;padding:20px 26px 24px;border-radius:2px;box-shadow:0 16px 34px rgba(0,0,0,.4);z-index:5;\">\n      <div style=\"position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);width:96px;height:26px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.32);\"><\u002Fdiv>\n      <div style=\"font-family:'Caveat',cursive;font-size:30px;line-height:1.15;font-weight:700;\">Not first to multi-turn memory — first to name and fix brevity bias + context collapse.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { s1: null, s2: null, s3: null, s4: 0 };\n\n  renderVals() {\n    const { s1, s2, s3, s4 } = this.state;\n    const set = (k, v) => () => this.setState({ [k]: v });\n    return {\n      // Slide 1 — timeline\n      s1None: s1 === null,\n      s1Reflexion: s1 === 'reflexion',\n      s1TextGrad: s1 === 'textgrad',\n      s1Gepa: s1 === 'gepa',\n      s1Dc: s1 === 'dc',\n      pickReflexion: set('s1', 'reflexion'),\n      pickTextGrad: set('s1', 'textgrad'),\n      pickGepa: set('s1', 'gepa'),\n      pickDc: set('s1', 'dc'),\n      closeS1: set('s1', null),\n\n      // Slide 2 — two-sided\n      s2None: s2 === null,\n      s2Brevity: s2 === 'brevity',\n      s2Collapse: s2 === 'collapse',\n      pickBrevity: set('s2', 'brevity'),\n      pickCollapse: set('s2', 'collapse'),\n      closeS2: set('s2', null),\n\n      // Slide 3 — framework\n      s3None: s3 === null,\n      s3Query: s3 === 'query',\n      s3Generator: s3 === 'generator',\n      s3Trajectory: s3 === 'trajectory',\n      s3Reflector: s3 === 'reflector',\n      s3Insights: s3 === 'insights',\n      s3Curator: s3 === 'curator',\n      s3Delta: s3 === 'delta',\n      s3Playbook: s3 === 'playbook',\n      pickQuery: set('s3', 'query'),\n      pickGenerator: set('s3', 'generator'),\n      pickTrajectory: set('s3', 'trajectory'),\n      pickReflector: set('s3', 'reflector'),\n      pickInsights: set('s3', 'insights'),\n      pickCurator: set('s3', 'curator'),\n      pickDelta: set('s3', 'delta'),\n      pickPlaybook: set('s3', 'playbook'),\n      closeS3: set('s3', null),\n\n      // Slide 4 — playbook grows\n      s4: s4,\n      s4preMerge: s4 < 4,\n      s4deltaVisible: s4 >= 1 && s4 < 4,\n      s4newTag: s4 >= 1 && s4 < 3,\n      s4growTag: s4 === 3,\n      s4merged: s4 >= 4,\n      s4contrast: s4 === 2,\n      dot0: s4 === 0, ndot0: s4 !== 0,\n      dot1: s4 === 1, ndot1: s4 !== 1,\n      dot2: s4 === 2, ndot2: s4 !== 2,\n      dot3: s4 === 3, ndot3: s4 !== 3,\n      dot4: s4 === 4, ndot4: s4 !== 4,\n      dot5: s4 === 5, ndot5: s4 !== 5,\n      nextS4: () => this.setState((st) => ({ s4: Math.min(5, st.s4 + 1) })),\n      prevS4: () => this.setState((st) => ({ s4: Math.max(0, st.s4 - 1) })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
